[meta]
name = "epitelesis"
repo = "forkwright/epitelesis"
generated = false
source_docs = [
  "README.md",
  "ARCHITECTURE.md",
  "SECURITY.md",
  "release-please-config.json",
]

[decisions]
summary = "Accepted design and release decisions for the subprocess lifecycle substrate."

[[decision]]
id = "D-policy-complete-typestate"
title = "Require execution policy before a command is runnable"
status = "accepted"
context = "Implicit time, environment, and memory policies make subprocess safety depend on call-site discipline."
decision = "Command typestate requires a bounded deadline or reason-bearing unbounded execution. Clean/env_clear is the environment default; Allowlist is selective; InheritAll requires a reason. Capture defaults to 10 MiB per stream and fails closed, with explicit truncation, streaming, and exceptional reason-bearing unbounded alternatives."
consequences = "Risk-bearing choices are visible in construction and cannot be omitted accidentally."

[[decision]]
id = "D-single-supervisor"
title = "Give one supervisor the whole subprocess lifecycle"
status = "accepted"
context = "Splitting timeout, cancellation, capture, kill, and reap ownership loses cleanup failures and can leak descendants."
decision = "One supervisor owns spawn through final evidence. On Unix it kills the process group before reap, performs bounded capture cleanup, and aggregates lifecycle evidence. ManagedChild retains deadline, cancellation, and reap ownership."
consequences = "Results describe cleanup as well as the first observed failure; caller-managed execution cannot silently detach lifecycle obligations."

[[decision]]
id = "D-portability-boundary"
title = "Type unsupported lifecycle behavior"
status = "accepted"
context = "The required descendant cleanup semantics depend on Unix process groups."
decision = "Platforms that cannot provide the required lifecycle return typed unsupported results. Process groups are documented as operational containment, not a security sandbox, because hostile children can call setsid."
consequences = "Portability does not silently weaken termination guarantees, and callers must choose a real sandbox for hostile code."

[[decision]]
id = "D-async-additive"
title = "Keep async execution additive"
status = "accepted"
context = "Synchronous callers should not acquire an async runtime dependency."
decision = "The default build is synchronous. The async runner stays behind the async feature and implements the same policy and supervisor semantics."
consequences = "Sync-only dependency cost stays small while lifecycle behavior remains consistent."

[[decision]]
id = "D-release-truth"
title = "Verify one atomic release fact"
status = "accepted"
context = "Workspace, manifest, human documentation, and machine state can drift, while an untagged prospective release is valid only inside trusted release automation."
decision = "Align four release files. README and machine state use same-line generic Release Please markers. Ordinary verification requires the named local tag. Prospective verification requires a trusted bot PR, an explicit base, and all four files changed together."
consequences = "Normal PRs cannot advertise an untagged release, while a complete Release Please bump can pass before its tag exists."

[[decision]]
id = "D-dual-license"
title = "Dual-license Apache-2.0 OR MIT"
status = "accepted"
context = "The library is reusable subprocess infrastructure."
decision = "Distribute Epitelesis under Apache-2.0 OR MIT."
consequences = "Consumers may select either permissive license."
