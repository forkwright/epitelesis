[meta]
name = "epitelesis"
repo = "forkwright/epitelesis"
generated = false
source_docs = [
  "README.md",
  "Cargo.toml",
  ".release-please-manifest.json",
  "ARCHITECTURE.md",
]

[state]
release_version = "0.2.0" # x-release-please-version
release_status = "The workspace, manifest, README pin, machine state, and named local tag agree."
contract_status = "The breaking v1 invocation and supervisor contract is fixed for implementation and release."
updated = "2026-07-22"

[state.v1_contract]
deadline = "Typestate requires bounded execution or unbounded execution with a reason."
environment = "Clean/env_clear by default; Allowlist selective; InheritAll reason-bearing."
capture = "10 MiB per stream by default, fail-closed; truncation, streaming, and exceptional unbounded are explicit."
supervision = "One supervisor kills the Unix process group before reap, bounds capture cleanup, and aggregates evidence."
managed_child = "ManagedChild owns deadline, cancellation, and reap."
portability = "Unsupported non-Unix lifecycle behavior is typed."
sandbox = "Process groups are not a security sandbox because hostile children can call setsid."

[state.release_verification]
ordinary = "All four release files must align and the named local tag must exist."
prospective = "Only the trusted Release Please PR workflow may allow an untagged version, with an explicit base and all four files changed together."
files = [
  "Cargo.toml",
  ".release-please-manifest.json",
  "README.md",
  "_llm/current_state.toml",
]
