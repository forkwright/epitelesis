[meta]
name = "epitelesis"
repo = "forkwright/epitelesis"
generated = false
source_docs = [
  "README.md",
  "Cargo.toml",
  "Cargo.lock",
  ".release-please-manifest.json",
  "ARCHITECTURE.md",
]

[state]
release_version = "0.4.0" # x-release-please-version
release_status = "The workspace, local lockfile package, manifest, README pin, machine state, and ancestral local tag agree."
contract_status = "The breaking v1 invocation and supervisor contract is implemented and enforced on main, verified by the hosted full gate (gate / gate-attestation) on every merge."
updated = "2026-08-26"

[state.v1_contract]
deadline = "Typestate requires bounded execution or unbounded execution with a reason."
environment = "Clean/env_clear by default; Allowlist selective; InheritAll reason-bearing."
capture = "10 MiB per stream by default, fail-closed; truncation and exceptional unbounded capture are explicit, while streaming is a structural transition."
supervision = "One fair nonblocking poll loop owns both capture pipes, kills the Unix process group before reap, and aggregates boxed lifecycle evidence."
managed_child = "ManagedChild owns deadline, cancellation, and reap; the caller explicitly owns streaming bytes and backpressure."
portability = "Non-Unix and Unix targets without rustix waitid support return typed unsupported capability before spawn."
sandbox = "Process groups are not a security sandbox because hostile children can call setsid."

[state.release_verification]
ordinary = "All five release files must align and the selected local tag must be an ancestor of HEAD."
prospective = "Only authenticated Release Please policy may allow an untagged version, with an ancestral explicit base and all five files changed together."
files = [
  "Cargo.toml",
  "Cargo.lock",
  ".release-please-manifest.json",
  "README.md",
  "_llm/current_state.toml",
]

[state.hosted_gate]
protected_context = "gate / gate-attestation"
policy = "Release verification runs before fail-closed path classification."
build = "Only exact prose files skip; every code-affecting change requires the Ubuntu 24.04 full gate."
