name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# WHY: release-please must never race itself on rapid main pushes; queued
# runs are superseded, not cancelled, so an in-flight release finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# WHY: explicit grant of exactly what the shared workflow needs for release
# PR management and tag/release creation.
permissions:
  contents: write
  pull-requests: write

jobs:
  call:
    uses: forkwright/.github/.github/workflows/release-please.yml@dca8a29deedb6d665fd12ad4121f6e68988cad91
