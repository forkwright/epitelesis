name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# WHY: release-please must never race itself on rapid main pushes; queued
# runs are superseded, not cancelled, so an in-flight release finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

# WHY: explicit grant of exactly what the shared workflow needs for release
# PR management and tag/release creation.
permissions:
  contents: write
  pull-requests: write

jobs:
  call:
    # WHY @main, not a pinned SHA: forkwright/.github publishes no tags, so a
    # SHA pin here has no dependabot bump path and just freezes -- this file
    # had sat 5 weeks behind main. forkwright/.github is first-party -- same
    # org, same trust boundary -- not the third-party supply-chain case a SHA
    # pin defends against.
    uses: forkwright/.github/.github/workflows/release-please.yml@main
