# Provider security-report publication. Rust audit/deny and their daily schedule
# are owned by the native Forge pipeline in .kanon-ci.toml.
name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # NOTE: Daily at 05:23 CST (11:23 UTC). Off-peak minute per global
    # rule about avoiding :00/:30 cron schedules.
    - cron: "23 11 * * *"
  workflow_dispatch:

# PROJECT: explicit top-level default deny; job-level permissions grant only what's needed
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  osv-scanner:
    name: osv scanner
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: '--config=osv-scanner.toml --lockfile=Cargo.lock'
