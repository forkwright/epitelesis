[package]
name = "epitelesis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
authors.workspace = true
description = "Project-wide command-execution wrapper substrate for the forkwright fleet"
readme = "../../README.md"

[features]
default = []
# WHY: gates the Tokio adapter so consumers that only need synchronous
# execution do not pull an async runtime.
async = ["dep:tokio"]

[dependencies]
snafu = { workspace = true }
tracing = { workspace = true }
# WHY: tokio is gated behind the `async` feature so default builds stay
# sync-only and don't pay the runtime cost or dep weight when unused.
tokio = { workspace = true, optional = true }

[target.'cfg(all(unix, not(any(target_os = "cygwin", target_os = "horizon", target_os = "openbsd", target_os = "redox", target_os = "wasi"))))'.dependencies]
# WHY: process supplies waitid/process-group signaling, event supplies poll,
# and fs supplies safe fcntl nonblocking setup. Unsupported waitid targets do
# not acquire rustix and return a typed capability error before spawn.
rustix = { version = "1.1", default-features = false, features = ["event", "fs", "process", "std"] }

[dev-dependencies]
# WHY: tempfile-backed scratch directories let cwd/env tests exercise real
# filesystem state without polluting the worktree.
tempfile = "3"
# WHY: timeout + non-zero-exit fixtures spawn `sh -c '...'`-style commands; the
# async test path needs a runtime to drive `epitelesis::spawn`.
tokio = { workspace = true }
# WHY: the span-attribution regression test needs a real subscriber to make
# `Span::current()` observable, and `tracing` itself to inspect it.
tracing = { workspace = true }
tracing-subscriber = "0.3"

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# WHY: kanon's MANIFEST/missing-maturity-metadata expects every workspace
# member to declare maturity, since-date, and exit-criteria so the standards
# engine can read crate readiness without parsing rustdoc.
[package.metadata.kanon]
maturity = "alpha"
since = "2026-05-28"
exit-criteria = "the hosted protected gate proves the public v1 contract and all five aligned provider release facts"
