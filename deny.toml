# cargo-deny config for epitelesis.
#
# epitelesis is dual-licensed Apache-2.0 OR MIT. The dep tree is small
# (snafu, tracing, optional tokio); the license allowlist mirrors the
# theatron set for the permissive subset.

[graph]
targets = []
all-features = false

[advisories]

# WHY: keep in sync with .cargo/audit.toml's [advisories.ignore] array.
# cargo-audit does not read deny.toml, so any ignore lives in both files.

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "allow"
