# archetype:
# forge-only: true
# spdx: Apache-2.0 OR MIT

# Forge CI pipeline for forkwright/epitelesis.
#
# This is the canonical acceptance pipeline. GitHub retains provider release
# provenance and security-report publication; it does not execute this gate.

[pipeline]
stages = ["cargo fmt", "cargo check", "cargo clippy", "cargo nextest", "cargo doctests", "release policy tests", "cargo deny", "cargo audit", "kanon lint"]

[stages."cargo fmt"]
cmd = "cargo fmt --all -- --check"
timeout_secs = 300

[stages."cargo check"]
cmd = "cargo check --workspace --all-targets --all-features --locked --jobs 8"
timeout_secs = 600

[stages."cargo clippy"]
cmd = "cargo clippy --workspace --all-targets --all-features --locked --jobs 8 -- -D warnings"
timeout_secs = 600

[stages."cargo nextest"]
cmd = "cargo nextest run --workspace --all-features --locked --no-fail-fast --build-jobs 8 --test-threads 8"
timeout_secs = 900

[stages."kanon lint"]
cmd = "kanon lint . --summary"
timeout_secs = 300

[stages."cargo doctests"]
cmd = "cargo test --workspace --all-features --doc --locked --jobs 8"
timeout_secs = 600

[stages."release policy tests"]
cmd = "python3 -m unittest discover -s scripts/tests -v"
timeout_secs = 300

[stages."cargo deny"]
cmd = "cargo deny --all-features check advisories licenses bans sources"
timeout_secs = 900

[stages."cargo audit"]
cmd = "cargo audit --deny unmaintained --deny unsound --deny yanked"
timeout_secs = 900

[schedule.security]
cron = "0 23 11 * * * *"
ref = "refs/heads/main"
pipeline = ["cargo deny", "cargo audit"]
